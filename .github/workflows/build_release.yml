name: Build and Release Cross-Platform Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r app/requirements.txt

      - name: Build Main App with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --noupx --onedir --windowed `
            --name "MarketStore-POS" `
            --icon "app/images/desktop_icon.ico" `
            --version-file "packaging/version_info.txt" `
            --add-data "app/images;images" `
            --collect-data "certifi" `
            --hidden-import "PyQt6" `
            --hidden-import "sqlalchemy" `
            --paths "app" `
            app/main.py

      - name: Build Web Installer with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --noupx --onefile --windowed `
            --name "MarketStore_WebInstaller" `
            --icon "app/images/desktop_icon.ico" `
            --version-file "packaging/version_info.txt" `
            --collect-data "certifi" `
            --hidden-import "PyQt6" `
            --paths "app" `
            installer/web_installer.py

      - name: Sign Windows Applications
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          ./packaging/sign_windows.ps1 -Files @(
            "dist/MarketStore-POS/MarketStore-POS.exe",
            "dist/MarketStore_WebInstaller.exe"
          )

      - name: Install NSIS and Build Setup
        run: |
          choco install nsis -y
          $nsisExe = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsisExe)) { $nsisExe = "makensis" }
          $version = "${{ github.ref_name }}".TrimStart("v")
          Set-Location packaging
          & $nsisExe "/DPRODUCT_VERSION=$version" installer.nsi
          Set-Location ..

      - name: Sign and Verify Windows Setup
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $setup = Get-ChildItem "dist/MarketStore_Setup_*.exe" | Select-Object -First 1
          if ($setup) {
            ./packaging/sign_windows.ps1 -Files @($setup.FullName)
          }

      - name: Copy Installer Scripts to Dist
        run: |
          Copy-Item installer/install.ps1 -Destination dist/
          Copy-Item installer/install.sh -Destination dist/

      - name: Upload Windows Asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            dist/MarketStore_Setup_*.exe
            dist/MarketStore_WebInstaller.exe
            dist/install.ps1
            dist/install.sh

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libgl1 libegl1
          python -m pip install --upgrade pip
          pip install pyinstaller -r app/requirements.txt

      - name: Build PyInstaller Binary
        run: |
          pyinstaller --noconfirm --clean --noupx --onedir --windowed \
            --name "MarketStore-POS" \
            --add-data "app/images:images" \
            --collect-data "certifi" \
            --hidden-import "PyQt6" \
            --paths "app" \
            app/main.py

      - name: Create Linux Tarball & AppImage
        run: |
          mkdir -p dist/MarketStore.AppDir/usr/bin
          mkdir -p dist/MarketStore.AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p dist/MarketStore.AppDir/usr/share/applications
          cp -r dist/MarketStore-POS/* dist/MarketStore.AppDir/usr/bin/
          cp app/images/desktop.png dist/MarketStore.AppDir/usr/share/icons/hicolor/256x256/apps/marketstore.png
          cp app/images/desktop.png dist/MarketStore.AppDir/marketstore.png

          cat << 'EOF' > dist/MarketStore.AppDir/marketstore.desktop
          [Desktop Entry]
          Name=MarketStore POS
          Exec=MarketStore-POS
          Icon=marketstore
          Type=Application
          Categories=Office;Finance;
          EOF

          cat << 'EOF' > dist/MarketStore.AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/MarketStore-POS" "$@"
          EOF
          chmod +x dist/MarketStore.AppDir/AppRun

          # Create Tarball archive
          cd dist
          tar -czf MarketStore_${{ github.ref_name }}_linux_x86_64.tar.gz MarketStore-POS/
          cd ..

          # Download and build AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool || true
          if [ -f appimagetool ]; then
            chmod +x appimagetool
            ./appimagetool --appimage-extract || true
            if [ -d squashfs-root ]; then
              ARCH=x86_64 ./squashfs-root/AppRun dist/MarketStore.AppDir dist/MarketStore_${{ github.ref_name }}.AppImage || true
            fi
          fi

      - name: Upload Linux Asset
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/*.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r app/requirements.txt

      - name: Build macOS App
        run: |
          pyinstaller --noconfirm --clean --noupx --windowed \
            --name "MarketStore POS" \
            --add-data "app/images:images" \
            --collect-data "certifi" \
            --hidden-import "PyQt6" \
            --paths "app" \
            app/main.py

      - name: Sign macOS App Bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/MarketStore POS.app"
          echo "Signing macOS App Bundle with Ad-Hoc signature..."
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP" || true

      - name: Create DMG & Zip
        run: |
          cd dist
          zip -r "MarketStore_${{ github.ref_name }}_macos.zip" "MarketStore POS.app"
          cd ..
          npm install --global create-dmg || true
          create-dmg \
            --volname "MarketStore POS Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 420 185 \
            "dist/MarketStore_${{ github.ref_name }}.dmg" \
            "dist/MarketStore POS.app" || true

      - name: Upload macOS Asset
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            dist/*.zip

  publish-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-setup/*
            linux-appimage/*
            macos-dmg/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tells the API a new build is out. Every running desktop client is
      # already holding a sync event stream open, so they all light up their
      # update badge within a second or two - without a single one of them
      # having to poll GitHub and burn through the API rate limit.
      # Needs repo secrets: MARKETSTORE_API_URL and RELEASE_PING_SECRET.
      - name: Notify MarketStore API
        continue-on-error: true
        env:
          # Passed as env rather than inlined into the script: keeps the secret
          # out of the rendered command line and blocks script injection.
          API_URL: ${{ secrets.MARKETSTORE_API_URL }}
          PING_SECRET: ${{ secrets.RELEASE_PING_SECRET }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$PING_SECRET" ]; then
            echo "Release ping is not configured; skipping."
            exit 0
          fi
          payload=$(printf '{"tag": "%s"}' "$RELEASE_TAG")
          curl --fail --silent --show-error --location \
            --max-time 20 --retry 3 --retry-delay 5 \
            -X POST "${API_URL%/}/api/v1/app/release-published" \
            -H "Content-Type: application/json" \
            -H "X-Release-Secret: $PING_SECRET" \
            -H "ngrok-skip-browser-warning: true" \
            -d "$payload"
          echo "Notified API about $RELEASE_TAG"
