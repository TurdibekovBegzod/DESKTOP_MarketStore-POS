name: Desktop Tests

# Every push to main that touches the desktop app runs its tests - and only
# its tests. The API is tested by deploy_api.yml, on its own pushes.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/desktop_tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install desktop dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          python -m pip install --upgrade pip
          # pyinstaller is only needed to package the .exe, not to run tests.
          grep -v '^pyinstaller' app/requirements.txt > /tmp/app-test-requirements.txt
          pip install -r /tmp/app-test-requirements.txt
          pip install pytest

      # The failing lines go into the job summary as well as the log: reading a
      # workflow log needs admin rights on this repository, the summary does not.
      - name: Run desktop tests
        working-directory: app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          status=0
          python -m pytest tests -q 2>&1 | tee /tmp/desktop-tests.log || status=$?
          {
            echo "### Desktop testlar"
            echo '```'
            tail -n 80 /tmp/desktop-tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
