x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: marketstore-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: marketstore
      POSTGRES_USER: marketstore
      POSTGRES_PASSWORD: marketstore
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketstore -d marketstore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: marketstore-redis
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: marketstore-api
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://marketstore:marketstore@postgres:5432/marketstore}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in api/.env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      PASSWORD_RESET_CODE_MINUTES: ${PASSWORD_RESET_CODE_MINUTES:-10}
      PASSWORD_RESET_COOLDOWN_SECONDS: ${PASSWORD_RESET_COOLDOWN_SECONDS:-60}
      SIGNUP_VERIFICATION_CODE_MINUTES: ${SIGNUP_VERIFICATION_CODE_MINUTES:-3}
      SIGNUP_VERIFICATION_RESEND_SECONDS: ${SIGNUP_VERIFICATION_RESEND_SECONDS:-180}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-MarketStore POS}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      SYNC_EVENTS_REDIS_URL: ${SYNC_EVENTS_REDIS_URL:-redis://redis:6379/2}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,api}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      RELEASE_PING_SECRET: ${RELEASE_PING_SECRET:-}
      RELEASE_POLL_SECONDS: ${RELEASE_POLL_SECONDS:-600}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      SUPERADMIN_TOKEN_EXPIRE_MINUTES: ${SUPERADMIN_TOKEN_EXPIRE_MINUTES:-15}
      LOG_ARCHIVE_DIR: /var/log/marketstore
      LOG_POLL_SECONDS: ${LOG_POLL_SECONDS:-2}
      LOG_RETENTION_MONTHS: ${LOG_RETENTION_MONTHS:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # The archive is written by the logs service; the panel only reads it.
      - logs_data:/var/log/marketstore:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import Request, urlopen; urlopen(Request('http://127.0.0.1:8000/health', headers={'Host': 'api'}), timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: .
    container_name: marketstore-worker
    restart: unless-stopped
    logging: *default-logging
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=INFO", "--uid=nobody"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://marketstore:marketstore@postgres:5432/marketstore}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in api/.env}
      PASSWORD_RESET_CODE_MINUTES: ${PASSWORD_RESET_CODE_MINUTES:-10}
      SIGNUP_VERIFICATION_CODE_MINUTES: ${SIGNUP_VERIFICATION_CODE_MINUTES:-3}
      SIGNUP_VERIFICATION_RESEND_SECONDS: ${SIGNUP_VERIFICATION_RESEND_SECONDS:-180}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-MarketStore POS}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      redis:
        condition: service_healthy

  logs:
    # Copies every container's output into a monthly archive, so the control
    # panel can show more than the few megabytes Docker keeps per container.
    build: .
    container_name: marketstore-logs
    restart: unless-stopped
    logging: *default-logging
    command: ["python", "-m", "app.log_collector"]
    environment:
      LOG_ARCHIVE_DIR: /var/log/marketstore
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      LOG_POLL_SECONDS: ${LOG_POLL_SECONDS:-2}
      LOG_INITIAL_LINES: ${LOG_INITIAL_LINES:-200}
      LOG_RETENTION_MONTHS: ${LOG_RETENTION_MONTHS:-0}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in api/.env}
    volumes:
      - logs_data:/var/log/marketstore
      # Read-only view of the docker socket: the container list and their logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_started

  ngrok:
    image: docker.io/ngrok/ngrok:latest
    container_name: marketstore-ngrok
    restart: unless-stopped
    logging: *default-logging
    profiles: ["tunnel"]
    command:
      - "http"
      - "--url=${NGROK_DOMAIN:-}"
      - "http://api:8000"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_started

  alloy:
    image: docker.io/grafana/alloy:latest
    container_name: marketstore-alloy
    restart: unless-stopped
    logging: *default-logging
    profiles: ["monitoring"]
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    environment:
      # Which server the dashboards are showing, when there is more than one.
      MONITOR_INSTANCE: ${MONITOR_INSTANCE:-marketstore-prod}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      GRAFANA_PROM_URL: ${GRAFANA_PROM_URL:-}
      GRAFANA_PROM_USER: ${GRAFANA_PROM_USER:-}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:-}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
    volumes:
      - ./monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      # Read-only view of the docker socket: container list, stats and logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host metrics. Read-only, and nothing here is ever written back.
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_started

  nginx:
    build:
      context: ./nginx
      args:
        SERVER_NAME: ${NGINX_SERVER_NAME:-169.58.152.33}
    container_name: marketstore-nginx
    restart: unless-stopped
    logging: *default-logging
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  alloy_data:
  logs_data:
