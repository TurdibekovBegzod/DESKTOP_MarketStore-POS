x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketstore-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: marketstore
      POSTGRES_USER: marketstore
      POSTGRES_PASSWORD: marketstore
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketstore -d marketstore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: marketstore-redis
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: marketstore-api
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://marketstore:marketstore@postgres:5432/marketstore}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in api/.env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      PASSWORD_RESET_CODE_MINUTES: ${PASSWORD_RESET_CODE_MINUTES:-10}
      PASSWORD_RESET_COOLDOWN_SECONDS: ${PASSWORD_RESET_COOLDOWN_SECONDS:-60}
      SIGNUP_VERIFICATION_CODE_MINUTES: ${SIGNUP_VERIFICATION_CODE_MINUTES:-3}
      SIGNUP_VERIFICATION_RESEND_SECONDS: ${SIGNUP_VERIFICATION_RESEND_SECONDS:-180}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-MarketStore POS}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: .
    container_name: marketstore-worker
    restart: unless-stopped
    logging: *default-logging
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=INFO", "--uid=nobody"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://marketstore:marketstore@postgres:5432/marketstore}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in api/.env}
      PASSWORD_RESET_CODE_MINUTES: ${PASSWORD_RESET_CODE_MINUTES:-10}
      SIGNUP_VERIFICATION_CODE_MINUTES: ${SIGNUP_VERIFICATION_CODE_MINUTES:-3}
      SIGNUP_VERIFICATION_RESEND_SECONDS: ${SIGNUP_VERIFICATION_RESEND_SECONDS:-180}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-MarketStore POS}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
      args:
        SERVER_NAME: ${NGINX_SERVER_NAME:-169.58.152.33}
    container_name: marketstore-nginx
    restart: unless-stopped
    logging: *default-logging
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
